<style>

    --text:#f4f7fb; --muted:#a9b8cc; --line:rgba(255,255,255,.12);

    --wa:#25d366;
    --serif:"Cormorant Garamond", Georgia, serif;

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--navy);color:var(--text);font-family:var(--sans);min-height:100vh;
       -webkit-font-smoothing:antialiased;overflow-x:hidden}
  html[lang="ar"] body{font-family:var(--ar)}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* ---------- hero ---------- */
  .hero{position:relative;height:300px;overflow:hidden}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
            transition:opacity .6s ease;opacity:0}
  .hero img.on{opacity:1}
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(11,31,58,.35) 0%,rgba(11,31,58,.15) 35%,rgba(11,31,58,.75) 75%,var(--navy) 100%)}
  .topbar{position:absolute;z-index:2;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;
          display:flex;justify-content:space-between;align-items:center;gap:12px}
  .tabs{display:flex;background:rgba(11,31,58,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
        border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px;position:relative}
  .tab{position:relative;z-index:1;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;
       letter-spacing:.02em;color:rgba(255,255,255,.75);transition:color .3s;white-space:nowrap}
  .tab[aria-selected="true"]{color:var(--navy)}
  .pill{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:#fff;
        transition:transform .35s cubic-bezier(.4,.1,.2,1), width .35s cubic-bezier(.4,.1,.2,1);box-shadow:0 4px 14px rgba(0,0,0,.2)}
  .lang{min-width:44px;height:40px;border-radius:999px;background:rgba(11,31,58,.55);backdrop-filter:blur(12px);
        -webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);font-weight:700;font-size:14px;padding:0 12px}

  /* ---------- main ---------- */
  main{position:relative;z-index:3;max-width:520px;margin:-120px auto 0;padding:0 16px 40px}
  .panel{display:none;animation:rise .45s ease both}
  .panel.on{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .profile{text-align:center}
  .badge{width:132px;height:132px;margin:0 auto;border-radius:30px;background:#fff;display:grid;place-items:center;
         box-shadow:0 0 0 3px rgba(201,169,106,.6),0 18px 40px rgba(0,0,0,.35);overflow:hidden}
  .badge img{width:104%;height:104%;object-fit:contain}
  .badge.tmi img{width:84%;height:84%}
  h1{font-family:var(--serif);font-weight:600;font-size:31px;letter-spacing:.04em;margin-top:16px;line-height:1.1}
  .panel[data-co="tmi"] h1{font-family:var(--sans);font-weight:700;font-size:25px;letter-spacing:.01em}
  html[lang="ar"] h1{font-family:var(--ar);letter-spacing:0;font-weight:700;font-size:26px}
  .sub{color:var(--gold-2);font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;margin-top:6px;font-weight:600}
  html[lang="ar"] .sub{letter-spacing:0;font-size:14px;text-transform:none}
  .tag{color:var(--muted);font-size:14px;line-height:1.55;margin:12px auto 0;max-width:380px}
  html[lang="ar"] .tag{font-size:15.5px}

  .quick{display:flex;justify-content:center;gap:14px;margin:22px 0 26px}
  .q{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--muted);font-weight:500;min-width:58px}
  .q span.ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--card);
             border:1px solid var(--line);transition:background .2s, transform .2s}
  .q:hover span.ic{background:var(--card-h);transform:translateY(-2px)}
  .q.wa span.ic{background:var(--wa);border-color:var(--wa);color:#fff}
  .q svg{width:22px;height:22px}

  .group{margin-top:22px}
  .group h2{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700;
            margin:0 4px 10px;display:flex;align-items:center;gap:10px}
  html[lang="ar"] .group h2{letter-spacing:0;font-size:13.5px}
  .group h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(201,169,106,.4),transparent)}
  html[dir="rtl"] .group h2::after{background:linear-gradient(270deg,rgba(201,169,106,.4),transparent)}

  .link{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px;border-radius:16px;
        background:var(--card);border:1px solid var(--line);transition:background .2s,transform .2s,border-color .2s;min-height:64px}
  .link:hover{background:var(--card-h);border-color:rgba(255,255,255,.22);transform:translateY(-1px)}
  .link:active{transform:scale(.99)}
  .link .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08)}
  .link .ic svg{width:21px;height:21px}
  .link .tx{flex:1;min-width:0}
  .link b{display:block;font-size:15px;font-weight:600}
  .link small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link .go{flex:none;opacity:.5;width:18px;height:18px}
  html[dir="rtl"] .link .go{transform:scaleX(-1)}
  .link.feature{background:linear-gradient(135deg,rgba(201,169,106,.22),rgba(201,169,106,.06));border-color:rgba(201,169,106,.45)}
  .link.feature .ic{background:var(--gold);color:var(--navy)}
  .ig .ic{background:linear-gradient(45deg,#f9a13a,#e1306c 50%,#833ab4)}
  .tt .ic{background:#000}
  .sc .ic{background:#fffc00;color:#000}
  .wa-l .ic{background:var(--wa)}
  .yt .ic{background:#ff0000}
  .fb .ic{background:#1877f2}

  .todo{border-style:dashed;border-color:rgba(255,200,90,.6);opacity:.8}
  .todo small::before{content:"⚠ ";color:#ffc85a}

  footer{text-align:center;color:var(--muted);font-size:12px;line-height:1.8;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
  footer .em{color:var(--gold-2);font-family:var(--serif);font-size:17px;letter-spacing:.04em}
  html[lang="ar"] footer .em{font-family:var(--ar);font-size:15px;letter-spacing:0}
  footer .parent{margin-top:6px;font-size:11px;opacity:.75}

  :focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
  @media (min-width:600px){ .hero{height:360px} main{margin-top:-140px} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

  const attrs = href ? `href="${esc(href)}"${ext ? ' target="_blank" rel="noopener"' : ""}${l.dl ? " download" : ""}` : 'aria-disabled="true"';
  const sub = l.s[lang] || l.s.en;
  return `<a class="link ${l.cls||""} ${l.todo?"todo":""}" ${attrs}>
    <span class="ic">${I[l.icon]}</span>
    <span class="tx"><b>${esc(l.t[lang])}</b>${sub ? `<small>${esc(sub)}</small>` : ""}</span>
    ${l.dl ? I.dl : I.go}</a>`;
}

function panelHtml(key){
  const c = COMPANIES[key], u = UI[lang];
  const groups = c.groups.map(g => {
    const links = g.links.map(l => linkHtml(c, l)).join("");
    return links.trim() ? `<section class="group"><h2>${esc(g.title[lang])}</h2>${links}</section>` : "";
  }).join("");
  return `<div class="panel ${key===co?"on":""}" data-co="${key}" role="tabpanel">
    <div class="profile">
      <div class="badge ${key}"><img src="${c.logo}" alt="${esc(c.name.en)} logo"></div>
      <h1>${esc(c.name[lang])}</h1>
      <div class="sub">${esc(c.sub[lang])}</div>
      <p class="tag">${esc(c.tag[lang])}</p>
    </div>
    <nav class="quick" aria-label="Quick contact">
      <a class="q wa" href="${esc(waUrl(c))}" target="_blank" rel="noopener"><span class="ic">${I.wa}</span>${u.whatsapp}</a>
      <a class="q" href="tel:${PHONE}"><span class="ic">${I.phone}</span>${u.call}</a>
      <a class="q" href="mailto:${EMAIL}"><span class="ic">${I.mail}</span>${u.email}</a>
      <a class="q" href="${esc(MAP)}" target="_blank" rel="noopener"><span class="ic">${I.pin}</span>${u.map}</a>
    </nav>
    ${groups}
  </div>`;
}

function render(){
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("lang").textContent = lang === "ar" ? "EN" : "ع";
  document.querySelector('[data-i18n="tabBsm"]').textContent = u.tabBsm;
  document.getElementById("main").innerHTML =
    panelHtml("bsm") + panelHtml("tmi") +
    `<footer><div class="em">${u.em}</div><div>${u.est}</div><div class="parent">${u.parent}</div></footer>`;
  select(co, true);
}

function select(key, instant){
  co = key;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.co === key));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.dataset.co === key));
  document.querySelectorAll("[data-hero]").forEach(i => i.classList.toggle("on", i.dataset.hero === key));
  const tab = document.querySelector(`.tab[data-co="${key}"]`), pill = document.querySelector(".pill");
  pill.style.width = tab.offsetWidth + "px";
  pill.style.transform = `translateX(${tab.offsetLeft - 4}px)`;
  history.replaceState(null, "", key === "tmi" ? "#tmi" : location.pathname);
}

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { select(t.dataset.co); window.scrollTo({top:0,behavior:"smooth"}); }));
document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "en" ? "ar" : "en";
  try { localStorage.setItem("bsm-lang", lang); } catch(e) {}
  render();
});
window.addEventListener("resize", () => select(co));
document.fonts && document.fonts.ready.then(() => select(co));
render();
</script>
</body>
</html>
